[workspace]
resolver = "2"
members = ["crates/*"]
# crates/web only builds for wasm32-unknown-emscripten (see crates/web/build.sh).
default-members = ["crates/pen", "crates/render", "crates/study"]

[workspace.package]
edition = "2021"
version = "0.5.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
