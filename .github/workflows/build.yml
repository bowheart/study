name: build

# Every push builds and tests on macOS and Windows. Pushing a `v*` tag also publishes a GitHub
# release with the packaged apps.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: study-macos-arm64.tar.gz
          - os: windows-latest
            asset: study-windows-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      # Tag builds are releases: they check GitHub for newer releases and update themselves.
      STUDY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="0.0.0-dev"
          cargo run --release -p render --example mkicon -- assets/logo.svg target/icon
          app=dist/Study.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/study "$app/Contents/MacOS/study"
          iconutil -c icns target/icon/study.iconset -o "$app/Contents/Resources/study.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>study</string>
            <key>CFBundleDisplayName</key><string>study</string>
            <key>CFBundleIdentifier</key><string>io.github.bowheart.study</string>
            <key>CFBundleExecutable</key><string>study</string>
            <key>CFBundleIconFile</key><string>study</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no Apple Developer ID): fine for curl installs, see the README.
          codesign --force --deep --sign - "$app"
          tar -czf "${{ matrix.asset }}" -C dist Study.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/study.exe -DestinationPath "${{ matrix.asset }}"
          Copy-Item target/release/study.exe study-windows-x64.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: study-windows-x64.exe
          path: study-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Headless MCP server for Linux hosts (no window, menus or updater): `study mcp`.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo test -p pen -p render && cargo test -p study --no-default-features
      - run: cargo build --release -p study --no-default-features
      - name: Smoke test
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"execute","arguments":{"filePath":"'"$PWD"'/examples/showcase.pen","input":"Print(Get(\"ZcurH\").name)"}}}' \
            | target/release/study mcp | tee /dev/stderr | grep -q "Tidepool"
      - run: tar -czf study-linux-x64.tar.gz -C target/release study
      - uses: actions/upload-artifact@v4
        with:
          name: study-linux-x64.tar.gz
          path: study-linux-x64.tar.gz

  # The browser viewer (crates/web): study-viewer.js + study-web.js + study_web.wasm.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - run: crates/web/build.sh
      - run: cd crates/web/dist && zip ../../../study-web.zip study-viewer.js study-web.js study_web.wasm study-sandbox.html demo.html showcase.pen
      - uses: actions/upload-artifact@v4
        with:
          name: study-web.zip
          path: study-web.zip

  release:
    needs: [build, linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
