name: build

# Every push builds and tests on macOS and Windows. Pushing a `v*` tag also publishes a GitHub
# release with the packaged apps.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: study-macos-arm64.tar.gz
          - os: windows-latest
            asset: study-windows-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      # Tag builds are releases: they check GitHub for newer releases and update themselves.
      STUDY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="0.0.0-dev"
          cargo run --release -p render --example mkicon -- assets/logo.svg target/icon
          app=dist/Study.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/study "$app/Contents/MacOS/study"
          iconutil -c icns target/icon/study.iconset -o "$app/Contents/Resources/study.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>study</string>
            <key>CFBundleDisplayName</key><string>study</string>
            <key>CFBundleIdentifier</key><string>io.github.bowheart.study</string>
            <key>CFBundleExecutable</key><string>study</string>
            <key>CFBundleIconFile</key><string>study</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no Apple Developer ID): fine for curl installs, see the README.
          codesign --force --deep --sign - "$app"
          tar -czf "${{ matrix.asset }}" -C dist Study.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/study.exe -DestinationPath "${{ matrix.asset }}"
          Copy-Item target/release/study.exe study-windows-x64.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: study-windows-x64.exe
          path: study-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # The headless MCP server for Linux hosts. Skia's prebuilt binaries need glibc 2.38+, so it's built
  # on Ubuntu 24.04 and runs on glibc 2.39+ (Ubuntu 24.04, Debian 13). There are no prebuilt Skia
  # binaries for Linux arm64, so that job builds Skia from source (slow until the cache is warm).
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: study-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            asset: study-linux-arm64.tar.gz
            skia-from-source: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Set up a Skia source build
        if: matrix.skia-from-source
        run: |
          sudo apt-get install -y clang ninja-build python3
          # zlib's ARM CRC32 code needs the CRC extension spelled out.
          echo 'SKIA_GN_ARGS=extra_cflags_c=["-march=armv8-a+crc"]' >> "$GITHUB_ENV"
      - run: cargo test -p pen -p render && cargo test -p study --no-default-features
      - run: cargo build --release -p study --no-default-features
      - name: Smoke test
        run: |
          call() {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"execute","arguments":{"filePath":"'"$1"'","input":"'"$2"'"}}}' \
              | target/release/study mcp | tee /dev/stderr
          }
          call "$PWD/examples/showcase.pen" 'Print(Get(\"ZcurH\").name)' | grep "Tidepool" > /dev/null
          # Write confinement: the example is read-only, a new file in the writable directory isn't.
          mkdir -p /tmp/ws/deliverables && cp examples/showcase.pen /tmp/ws/home.pen
          export STUDY_ROOT=/tmp/ws STUDY_WRITABLE=/tmp/ws/deliverables STUDY_EVENTS=/tmp/ws/events.jsonl
          call /tmp/ws/home.pen 'Update(\"ZcurH\", {name: \"x\"})' | grep "home.pen is read-only" > /dev/null
          cmp examples/showcase.pen /tmp/ws/home.pen
          call /tmp/ws/../etc/passwd 'Print(1)' | grep "outside the workspace" > /dev/null
          call /tmp/ws/deliverables/new.pen 'Insert(document, {type: \"frame\", width: 10, height: 10})'
          grep '"created":true' /tmp/ws/events.jsonl | grep -q '"file":"deliverables/new.pen"'
      - run: tar -czf ${{ matrix.asset }} -C target/release study
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # The browser viewer (crates/web): study-viewer.js + study-web.js + study_web.wasm.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - run: crates/web/build.sh
      - run: cd crates/web/dist && zip ../../../study-web.zip study-viewer.js study-web.js study_web.wasm study-sandbox.html Inter-OFL.txt demo.html compare.html changes.html showcase.pen
      - uses: actions/upload-artifact@v4
        with:
          name: study-web.zip
          path: study-web.zip

  release:
    needs: [build, linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
