name: build

# Every push builds and tests on macOS and Windows. Pushing a `v*` tag also publishes a GitHub
# release with the packaged apps.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: study-macos-arm64.tar.gz
          - os: windows-latest
            asset: study-windows-x64.zip
    runs-on: ${{ matrix.os }}
    env:
      # Tag builds are releases: they check GitHub for newer releases and update themselves.
      STUDY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="0.0.0-dev"
          cargo run --release -p render --example mkicon -- assets/logo.svg target/icon
          app=dist/Study.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/study "$app/Contents/MacOS/study"
          iconutil -c icns target/icon/study.iconset -o "$app/Contents/Resources/study.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>study</string>
            <key>CFBundleDisplayName</key><string>study</string>
            <key>CFBundleIdentifier</key><string>io.github.bowheart.study</string>
            <key>CFBundleExecutable</key><string>study</string>
            <key>CFBundleIconFile</key><string>study</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no Apple Developer ID): fine for curl installs, see the README.
          codesign --force --deep --sign - "$app"
          tar -czf "${{ matrix.asset }}" -C dist Study.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/study.exe -DestinationPath "${{ matrix.asset }}"
          Copy-Item target/release/study.exe study-windows-x64.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: study-windows-x64.exe
          path: study-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
