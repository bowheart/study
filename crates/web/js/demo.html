<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study web viewer</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #0002; flex-wrap: wrap; }
  #status { margin-left: auto; color: #666; }
  main { position: relative; flex: 1; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #toolbar { position: absolute; display: none; gap: 6px; align-items: center; padding: 6px; border-radius: 10px;
    background: #111827; color: #fff; box-shadow: 0 6px 24px #0004; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; }
  #toolbar button { background: #3B82F6; color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #context { position: absolute; right: 12px; bottom: 12px; width: min(420px, 60%); max-height: 50%; overflow: auto; display: none;
    background: #fff; color: #111; border: 1px solid #0002; border-radius: 10px; padding: 10px; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
  #context img { max-width: 100%; display: block; margin-bottom: 8px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <input type="file" id="file" accept=".pen,application/json">
  <select id="theme"><option>system</option><option>light</option><option>dark</option></select>
  <button id="fit">Fit</button>
  <button id="agent">Simulate agent</button>
  <span id="status">Drop a .pen file here, or pass ?file=url</span>
</header>
<main>
  <canvas id="canvas"></canvas>
  <div id="toolbar"><span id="picked"></span><button id="ask">Ask AI about this</button></div>
  <div id="context"></div>
</main>
<script type="module">
  import { createViewer } from "./study-viewer.js";

  const $ = (id) => document.getElementById(id);
  const path = new URLSearchParams(location.search).get("file") ?? "showcase.pen";
  // Files a document refers to are served next to it here; an app would read its own storage.
  const readFile = async (p) => {
    const res = await fetch(new URL(p, location.href));
    return res.ok ? res.arrayBuffer() : null;
  };
  const viewer = await createViewer($("canvas"), { readFile });
  window.viewer = viewer;
  let doc = null;

  async function show(text, file) {
    const t0 = performance.now();
    await viewer.load(text, { path: file });
    doc = JSON.parse(text);
    $("status").textContent = `${file}: loaded in ${Math.round(performance.now() - t0)} ms`;
  }

  fetch(path).then((r) => r.ok ? r.text() : Promise.reject(new Error(`${path}: ${r.status}`)))
    .then((t) => show(t, path)).catch((e) => ($("status").textContent = e.message));

  const open = async (f) => { try { await show(await f.text(), f.name); } catch (e) { $("status").textContent = e.message; } };
  $("file").onchange = (e) => e.target.files[0] && open(e.target.files[0]);
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", (e) => { e.preventDefault(); e.dataTransfer.files[0] && open(e.dataTransfer.files[0]); });
  $("theme").onchange = (e) => viewer.setTheme(e.target.value);
  $("fit").onclick = () => viewer.fit();
  $("agent").onclick = () => {
    const roots = (doc?.children ?? []).map((n) => n.id);
    viewer.working(roots.slice(0, 1));
    viewer.scan(roots.slice(0, 6));
  };
  viewer.addEventListener("warning", (e) => ($("status").textContent = e.detail.message));

  // A toolbar that follows the selection, and the context an "Ask AI" button would send.
  function placeToolbar() {
    const [node] = viewer.selection;
    $("toolbar").style.display = node ? "flex" : "none";
    if (!node) return;
    $("picked").textContent = `${node.name ?? node.id} · ${node.type}`;
    $("toolbar").style.left = `${node.screen.x + node.screen.width / 2}px`;
    $("toolbar").style.top = `${Math.max(48, node.screen.y)}px`;
  }
  viewer.addEventListener("select", placeToolbar);
  viewer.addEventListener("viewchange", placeToolbar);
  $("ask").onclick = () => {
    const [node] = viewer.selection;
    const context = { file: path, node, json: viewer.nodeJson(node.id) };
    const png = viewer.snapshot(node.id);
    $("context").style.display = "block";
    $("context").innerHTML = "";
    if (png) $("context").append(Object.assign(document.createElement("img"), { src: URL.createObjectURL(png) }));
    $("context").append(JSON.stringify(context, null, 2));
  };
</script>
</body>
</html>
