[package]
name = "study"
edition.workspace = true
version.workspace = true
description = "A local canvas for .pen design files, driven over MCP"

[[bin]]
name = "study"
path = "src/main.rs"

[dependencies]
pen = { path = "../pen" }
render = { path = "../render" }
anyhow.workspace = true
serde_json.workspace = true
skia-safe = { version = "0.156", features = ["gl", "textlayout", "svg"] }
rquickjs = "0.14.0"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gl = "0.14"
base64 = "0.23.1"
rfd = "0.17.2"
fastrand = "2.5.0"
muda = "0.21"
ureq = "3.5.0"
flate2 = "1.1.10"
tar = "0.4.46"
usvg = { version = "0.49", default-features = false }

[build-dependencies]
embed-resource = "3"
