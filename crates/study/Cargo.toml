[package]
name = "study"
edition.workspace = true
version.workspace = true
description = "A local canvas for .pen design files, driven over MCP"

[[bin]]
name = "study"
path = "src/main.rs"

[dependencies]
pen = { path = "../pen" }
render = { path = "../render" }
anyhow.workspace = true
serde_json.workspace = true
skia-safe = { version = "0.156", features = ["gl", "textlayout", "svg"] }
rquickjs = "0.14.0"
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }
gl = { version = "0.14", optional = true }
base64 = "0.23.1"
rfd = { version = "0.17.2", optional = true }
fastrand = "2.5.0"
muda = { version = "0.21", optional = true }
ureq = { version = "3.5.0", optional = true }
flate2 = { version = "1.1.10", optional = true }
tar = { version = "0.4.46", optional = true }
usvg = { version = "0.49", default-features = false }

[features]
default = ["gui"]
# The canvas window, menus and self-updater. Without it (`--no-default-features`), study is the
# headless MCP server only: for Linux servers, where it needs no windowing libraries.
gui = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle", "dep:gl", "dep:rfd", "dep:muda", "dep:ureq", "dep:flate2", "dep:tar"]

[build-dependencies]
embed-resource = "3"
